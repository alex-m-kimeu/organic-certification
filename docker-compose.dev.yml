services:
    db:
        container_name: db
        image: postgres:16
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - organic_certification_network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

    test-db:
        container_name: test-db
        image: postgres:16
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}_test
        ports:
            - '5433:5432'
        volumes:
            - test_postgres_data:/var/lib/postgresql/data
        networks:
            - organic_certification_network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}_test']
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        container_name: organic-backend
        build:
            context: ./backend
            dockerfile: Dockerfile
        restart: always
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            PORT: 8080
            NODE_ENV: production
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
            CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
            BASE_URL: ${BASE_URL}
            LOCAL_STORAGE_DIR: /app/storage/certificates
        ports:
            - '8080:8080'
        volumes:
            - certificate_storage:/app/storage/certificates
        networks:
            - organic_certification_network
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    frontend:
        container_name: organic-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        restart: always
        environment:
            NODE_ENV: production
            PORT: 3000
            HOSTNAME: 0.0.0.0
        ports:
            - '3000:3000'
        networks:
            - organic_certification_network
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

volumes:
    postgres_data:
    test_postgres_data:
    certificate_storage:

networks:
    organic_certification_network:
        driver: bridge
